name: Auto Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Masuk ke direktori backend di VPS
            cd /var/www/yuni-backend
            
            # Reset dan tarik kode terbaru dari branch main
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            
            # Install dependensi PHP terbaru
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Jalankan migrasi database jika ada perubahan
            php artisan migrate --force
            
            # Buat link storage jika belum ada
            php artisan storage:link || true
            
            # Optimasi cache Laravel
            php artisan optimize:clear
            php artisan optimize
            
            # Pastikan perizinan folder benar
            chown -R www-data:www-data /var/www/yuni-backend
            chmod -R 775 storage bootstrap/cache
            
            # Restart service PHP-FPM
            systemctl restart php8.3-fpm
            
            echo "✅ Deploy Backend Selesai!"
